name: Build Flora

on:
  pull_request:
    branches:
      - main
jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint all packages
        run: pnpm lint

      - name: Build UI library
        run: pnpm build:ui

      - name: Build site
        run: pnpm build:site
