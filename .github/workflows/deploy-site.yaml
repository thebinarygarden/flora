name: Deploy Site to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'packages/site/**'
      - 'packages/flora/**'
      - '.github/workflows/deploy-site.yaml'

env:
  IMAGE: flora

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless GCP login (Workload Identity Federation)

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: binarygarden

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/68521433417/locations/global/workloadIdentityPools/github/providers/github
          service_account: bg-cicd@binarygarden.iam.gserviceaccount.com

      - name: Authenticate Docker to Google Cloud Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/site/Dockerfile
          push: true
          tags: us-central1-docker.pkg.dev/binarygarden/bg-images/${{ env.IMAGE }}:${{ github.sha }}
          no-cache: true
          provenance: false

      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy flora \
          --image us-central1-docker.pkg.dev/binarygarden/bg-images/${{ env.IMAGE }}:${{ github.sha }} \
          --port=8080 \
          --region us-central1 \
          --allow-unauthenticated \
          --service-account flora-runtime@binarygarden.iam.gserviceaccount.com
